name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # GitHub web arayüzünden tek tıkla elle başlatabilmek için

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      # NDK ve CMake kurulumu (senin C/CAPT kütüphanesini derlemek için)
      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # Çıkan APK'yı GitHub'dan doğrudan indirilebilir dosya yap
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ohmycapT-debug-apk
          path: app/build/outputs/apk/debug/*.apk
